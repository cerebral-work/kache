# Blackwall build-pipeline custody config for Kache (cerebral-work/kache).
# Custody chain: run -> settle -> reconcile -> verify -> PR -> merge-gate.

[defaults]
provider = "gateway"
model = "kimi-k3"

[verify]
# Fail-closed workspace gate (-j 2 throttled fmt, clippy -D warnings, client-crates, resource guard, tests).
command = "make check"

[merge]
# Green CI reports ready; operator or fast-forward lane lands explicitly.
automerge = false

[budget]
max_tokens_per_run = 200000
