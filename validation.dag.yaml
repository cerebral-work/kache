# Kache Workstation & CI Validation DAG for dagrun v0.15.0+
# Applies two-level cgroup-v2 containment, CPA moldable CPU width planning,
# rss_baseline_bytes memory admission, and cargo-target lock serialization on ceres.

version: 2

defaults:
  timeout: 900
  env:
    CARGO_BUILD_JOBS: "2"
    JOBS: "2"
    RUSTC_WRAPPER: ""

resource_caps:
  cargo-target: 1

steps:
  - job: version-consistency
    group: hygiene
    desc: "Verify workspace crate versions and Helm Chart.yaml match Cargo.toml"
    cmd: "./scripts/check-version-consistency.sh"
    cmdtype: unknown
    hint:
      est_duration_s: 0.5
      rss_baseline_bytes: 134217728
      hard_mem_max_bytes: 536870912

  - job: docs-check
    group: hygiene
    desc: "Validate MDX frontmatter, internal links, install pins, and CLI/config docs"
    cmd: "bash scripts/check-docs.sh"
    cmdtype: unknown
    hint:
      est_duration_s: 1.0
      rss_baseline_bytes: 134217728
      hard_mem_max_bytes: 536870912

  - job: resource-guard-check
    group: hygiene
    desc: "Verify with-test-resources.sh raised-limit and fallback thread guards"
    cmd: "./scripts/test-with-test-resources.sh"
    cmdtype: unknown
    hint:
      est_duration_s: 1.0
      rss_baseline_bytes: 134217728
      hard_mem_max_bytes: 536870912

  - job: fmt-check
    group: rust
    desc: "Verify formatting across workspace, command schema, and fuzz crate"
    cmd: "make fmt-check"
    cmdtype: unknown
    hint:
      est_duration_s: 1.5
      rss_baseline_bytes: 268435456
      hard_mem_max_bytes: 1073741824

  - job: client-crates-check
    group: rust
    desc: "Verify client-only dependency graph without daemon async features (-j 2)"
    cmd: "make client-crates-check"
    cmdtype: cargo-build
    deps:
      - rust.fmt-check
      - hygiene.version-consistency
    hint:
      est_duration_s: 15.0
      rss_baseline_bytes: 2147483648
      hard_mem_max_bytes: 6442450944
      preferred_inner_jobs: 2
      resources:
        cargo-target: 1

  - job: clippy
    group: rust
    desc: "Run workspace clippy with -D warnings (-j 2)"
    cmd: "cargo clippy --workspace --locked -j 2 --all-targets -- -D warnings"
    cmdtype: cargo-build
    deps:
      - rust.client-crates-check
      - hygiene.docs-check
    hint:
      est_duration_s: 25.0
      rss_baseline_bytes: 3221225472
      hard_mem_max_bytes: 8589934592
      preferred_inner_jobs: 2
      resources:
        cargo-target: 1

  - job: test
    group: rust
    desc: "Run workspace unit and integration tests under resource guard (-j 2)"
    cmd: "./scripts/with-test-resources.sh cargo test --workspace --locked -j 2"
    cmdtype: cargo-test
    deps:
      - rust.clippy
      - hygiene.resource-guard-check
    hint:
      est_duration_s: 45.0
      rss_baseline_bytes: 3221225472
      hard_mem_max_bytes: 8589934592
      preferred_inner_jobs: 2
      resources:
        cargo-target: 1
